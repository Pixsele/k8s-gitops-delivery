imagePullSecrets:
  - name: regcred

appA:
  name: app-a
  replicas: 1
  nodeSelector: {}
  image: registry.home.kerro.space/pixsele/k8s-gitops-delivery/app-a
  tag: latest
  imagePolicy: IfNotPresent
  interval: "5"
  env:
    - name: POD
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: NODE
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName

appB:
  name: app-b
  replicas: 1
  nodeSelector:
    kubernetes.io/hostname: minikube-m03
  image: registry.home.kerro.space/pixsele/k8s-gitops-delivery/app-b
  tag: latest
  imagePolicy: IfNotPresent
  service:
    name: app-b
    type: ClusterIP
    port: 8080
  env:
    - name: PORT
      value: "8080"
    - name: POD
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: NODE
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
