apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitlab.home.kerro.space/pixsele/k8s-gitops-delivery.git
    targetRevision: main
    path: charts
    helm:
      releaseName: apps
      valueFiles:
        - values.yaml
        - values-ci.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true